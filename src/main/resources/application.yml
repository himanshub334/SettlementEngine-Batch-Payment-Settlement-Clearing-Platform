server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settlement}
    username: ${DB_USERNAME:settlement}
    password: ${DB_PASSWORD:settlement}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
settlement:
  rates:
    domestic: ${SETTLEMENT_DOMESTIC_RATE:0.015}
    cross-border: ${SETTLEMENT_CROSS_BORDER_RATE:0.025}
    premium: ${SETTLEMENT_PREMIUM_RATE:0.020}
